name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate sample sheet
        run: python scripts/validate_samplesheet.py tests/fixtures/samplesheet_valid.csv
      - name: Unit tests
        run: python -m unittest discover -s tests -v
  nextflow-stub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Nextflow
        run: |
          curl -s https://get.nextflow.io | bash
          sudo mv nextflow /usr/local/bin/
      - name: Check workflow wiring (stub mode only)
        run: |
          nextflow run main.nf -stub-run -profile ci \
            --input tests/fixtures/samplesheet_valid.csv \
            --fasta tests/fixtures/reference.fa \
            --gtf tests/fixtures/genes.gtf \
            --outdir ci-results
  real-geo-analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.3"
      - name: Install R and Bioconductor dependencies
        run: Rscript env/install_bioc.R
      - name: Run real GEO GSE196006 analysis
        run: Rscript scripts/analyze_gse196006.R --outdir results
      - name: Upload real-data analysis outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gse196006-analysis-results
          path: results/
          if-no-files-found: warn
          retention-days: 14
