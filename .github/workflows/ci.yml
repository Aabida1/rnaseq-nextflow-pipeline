name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      run_full_analysis:
        description: "Install R/Bioconductor dependencies and run full DESeq2 analysis"
        required: true
        type: boolean
        default: false
jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate sample sheet
        run: python scripts/validate_samplesheet.py tests/fixtures/samplesheet_valid.csv
      - name: Unit tests
        run: python -m unittest discover -s tests -v
  nextflow-stub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Nextflow
        run: |
          curl -s https://get.nextflow.io | bash
          sudo mv nextflow /usr/local/bin/
      - name: Check workflow wiring (stub mode only)
        run: |
          nextflow run main.nf -stub-run -profile ci \
            --input tests/fixtures/samplesheet_valid.csv \
            --fasta tests/fixtures/reference.fa \
            --gtf tests/fixtures/genes.gtf \
            --outdir ci-results
  geo-sample-parsing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate actual GEO sample names and matched pairs
        run: python scripts/check_geo_samples.py
  real-geo-analysis:
    if: github.event_name == 'workflow_dispatch' && inputs.run_full_analysis == true
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Set up precompiled R/Bioconductor environment
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: env/analysis-environment.yml
          environment-name: rnaseq-analysis
          cache-environment: true
          init-shell: bash
      - name: Verify required analysis packages
        shell: bash -el {0}
        run: |
          Rscript -e 'stopifnot(requireNamespace("DESeq2", quietly=TRUE), requireNamespace("ggplot2", quietly=TRUE)); sessionInfo()'
      - name: Run real GEO GSE196006 analysis
        shell: bash -el {0}
        run: Rscript scripts/analyze_gse196006.R --outdir results
      - name: Upload real-data analysis outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gse196006-analysis-results
          path: results/
          if-no-files-found: warn
          retention-days: 14
